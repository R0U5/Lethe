[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abliterate"
version = "0.1.0"
description = "Model-agnostic abliteration of refusal directions from transformer language models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thanos" }]
dependencies = [
    "torch>=2.1",
    "transformers>=4.44",
    "peft>=0.11",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "numpy>=1.24",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
datasets = ["datasets>=2.19"]
optimize = ["optuna>=3.6"]
dev = ["pytest>=8.0", "optuna>=3.6"]
all = ["datasets>=2.19", "optuna>=3.6"]

[project.scripts]
abliterate = "abliterate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abliterate = ["py.typed"]
